# Unified Knowledge Store configuration (TOML)

[storage]
store_root = "~/.dolphin/knowledge_store"

[server]
endpoint = "127.0.0.1:7777"

[chunking]
default_window_size = 350
overlap_pct = 0.10

[chunking.per_language]
python = 512
typescript = 350
markdown = 256

[languages]
py = "python"
ts = "typescript"
md = "markdown"
json = "json"
jsonc = "json"
json5 = "json"
toml = "toml"
yaml = "yaml"
yml = "yaml"
c = "c"
h = "c"
cpp = "cpp"
cxx = "cpp"
cc = "cpp"
hpp = "cpp"
hxx = "cpp"
hh = "cpp"
java = "java"
kt = "kotlin"
go = "go"
rs = "rust"
rb = "ruby"
php = "php"
sh = "shell"
bash = "shell"
zsh = "shell"
txt = "text"
log = "text"

[embeddings]
model = "text-embedding-3-small"
default_embed_model = "small"
concurrency = 3
per_session_spend_cap_usd = 10.0

[tokenizer]
encoding = "cl100k_base"

[retrieval]
top_k = 8
max_snippet_tokens = 240
score_cutoff = 0.15

ignore = [
    ".env",
    ".env.*",
    ".secrets",
    "node_modules/**",
    ".npm",
    ".pnpm-store",
    ".yarn",
    ".yarn/cache",
    "dist/**",
    "build/**",
    "coverage/**",
    ".cache/**",
    "target/**",
    "vendor/**",
    ".svelte-kit/**",
    ".vercel/**",
    ".vite/**",
    ".next/**",
    ".venv/**",
    ".mypy_cache/**",
    ".pytest_cache/**",
    ".DS_Store",
]

except = [
    ".env.example"
]