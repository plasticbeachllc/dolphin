global:
  resolve_timeout: 5m

route:
  group_by: ['alertname', 'severity', 'component']
  group_wait: 10s
  group_interval: 10s
  repeat_interval: 12h
  receiver: 'default'
  routes:
    - match:
        severity: critical
      receiver: 'critical'
      continue: true
    - match:
        severity: warning
      receiver: 'warning'
    - match:
        severity: info
      receiver: 'info'

receivers:
  - name: 'default'
    # Default receiver (logs only)

  - name: 'critical'
    # Add Slack/PagerDuty integration here
    # slack_configs:
    #   - api_url: 'YOUR_SLACK_WEBHOOK_URL'
    #     channel: '#alerts-critical'
    #     title: '🚨 {{ .GroupLabels.alertname }}'
    #     text: |
    #       *Summary:* {{ .CommonAnnotations.summary }}
    #       *Description:* {{ .CommonAnnotations.description }}
    #       *Component:* {{ .CommonLabels.component }}

  - name: 'warning'
    # Add Slack integration for warnings
    # slack_configs:
    #   - api_url: 'YOUR_SLACK_WEBHOOK_URL'
    #     channel: '#alerts-warning'
    #     title: '⚠️  {{ .GroupLabels.alertname }}'

  - name: 'info'
    # Info alerts (low priority)

inhibit_rules:
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname', 'component']
