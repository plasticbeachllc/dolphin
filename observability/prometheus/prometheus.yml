global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'dolphin-dev'
    environment: 'development'

# Scrape configs
scrape_configs:
  # Knowledge Bank API (Python/FastAPI)
  - job_name: 'kb-api'
    static_configs:
      - targets: ['host.docker.internal:8000']
    metrics_path: '/metrics'
    scrape_interval: 10s

  # Agent Core (Bun/TypeScript)
  - job_name: 'agent-core'
    static_configs:
      - targets: ['host.docker.internal:9091']
    metrics_path: '/metrics'
    scrape_interval: 10s

  # MCP Bridge (Bun/TypeScript)
  - job_name: 'mcp-bridge'
    static_configs:
      - targets: ['host.docker.internal:9092']
    metrics_path: '/metrics'
    scrape_interval: 10s

  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Jaeger metrics
  - job_name: 'jaeger'
    static_configs:
      - targets: ['jaeger:14269']
