server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  # Dolphin application logs
  - job_name: dolphin-logs
    static_configs:
      - targets:
          - localhost
        labels:
          job: dolphin
          __path__: /dolphin/logs/*.jsonl
    pipeline_stages:
      - json:
          expressions:
            timestamp: timestamp
            level: level
            message: message
            component: component
            trace_id: trace_id
            span_id: span_id
      - labels:
          level:
          component:
      - timestamp:
          source: timestamp
          format: RFC3339
      - output:
          source: message

  # MCP bridge logs
  - job_name: mcp-bridge
    static_configs:
      - targets:
          - localhost
        labels:
          job: mcp-bridge
          __path__: /dolphin/mcp-bridge/logs/*.log
    pipeline_stages:
      - json:
          expressions:
            timestamp: timestamp
            level: level
            message: message
            component: component
            trace_id: trace_id
            span_id: span_id
      - labels:
          level:
          component:
      - timestamp:
          source: timestamp
          format: RFC3339
      - output:
          source: message

  # System logs
  - job_name: system
    static_configs:
      - targets:
          - localhost
        labels:
          job: varlogs
          __path__: /var/log/*log
