[tool:pytest]
minversion = 7.4
testpaths = tests
addopts =
    --strict-markers
    --strict-config
    --verbose
    --tb=short
    -n auto
    --maxfail=5
asyncio_mode = auto
markers =
    unit: Unit tests
    integration: Integration tests
    slow: Slow tests (skipped by default)
    async: Async tests

# Exclude scripts from pytest
norecursedirs = scripts

filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning