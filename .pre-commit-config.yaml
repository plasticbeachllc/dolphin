minimum_pre_commit_version: "3.6.0"

repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff-check
        entry: uv run ruff check
        language: system
        pass_filenames: false
      - id: ruff-format-check
        name: ruff-format-check
        entry: uv run ruff format --check
        language: system
        pass_filenames: false
      - id: bun-lint-all
        name: bun-lint-all
        entry: bun run lint:all
        language: system
        pass_filenames: false
      - id: smoke-tests
        name: smoke-tests
        entry: bash scripts/precommit-smoke.sh
        language: system
        pass_filenames: false
