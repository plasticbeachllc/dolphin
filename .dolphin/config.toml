# Dolphin repo-level configuration
# Repo-specific settings are limited to ignore patterns and exceptions.
# Chunking overrides belong in .dolphin/chunking_config.toml.

# ======================================================================
# IGNORE PATTERNS
# ======================================================================
# Files and directories to ignore during indexing (glob patterns)
ignore = [
    # Version control
    ".git/**",
    ".svn/**",
    ".hg/**",

    # Dependencies
    "node_modules/**",
    "venv/**",
    ".venv/**",
    "env/**",
    "__pycache__/**",
    "*.pyc",
    "*.pyo",

    # Build artifacts
    "dist/**",
    "build/**",
    "target/**",
    "out/**",
    ".next/**",
    ".nuxt/**",

    # IDE / Editor
    ".vscode/**",
    ".idea/**",
    "*.swp",
    "*.swo",
    "*~",
    ".DS_Store",

    # Configuration directories (contain secrets/private data)
    ".continue/**",
    ".continue-config/**",
    ".kilocode-config/**",

    # Caches
    ".cache/**",
    ".pytest_cache/**",
    ".mypy_cache/**",
    ".ruff_cache/**",

    # Test and config files
    "pytest.ini",
    "chunking_config.toml",
    ".dolphin/**",
    "*.log",
    "*.log.*",

    # Test directories
    "tests/**",

    # Zero-value for semantic code search
    "**/.gitignore",
    "**/.gitattributes",
    "**/.gitmodules",
    "**/.dockerignore",
    "**/.editorconfig",
    "**/.eslintignore",
    "**/.prettierignore",
    "**/.prettierrc",
    "**/.eslintrc",
    "**/.npmignore",
    "**/.hgignore",

    # Lock files
    "package-lock.json",
    "yarn.lock",
    "pnpm-lock.yaml",
    "poetry.lock",
    "Pipfile.lock",
    "Cargo.lock",
    "bun.lock",
    "uv.lock",

    # Compiled / Binary
    "*.so",
    "*.dylib",
    "*.dll",
    "*.exe",
    "*.o",
    "*.a",

    # Archives
    "*.zip",
    "*.tar.gz",
    "*.rar",
    "*.7z",

    # Media
    "*.jpg",
    "*.jpeg",
    "*.png",
    "*.gif",
    "*.ico",
    "*.svg",
    "*.pdf",
    "*.mp3",
    "*.mp4",
    "*.avi",
]

# Optional patterns to un-ignore (glob patterns)
# ignore_exceptions = [
#     "docs/assets/logo.svg",
# ]
