# Dolphin Repository Chunking Configuration
# This file configures token window sizes for file chunking in semantic retrieval

# Default token window size for this repository
# Recommended range: 200-500 tokens for vector database semantic retrieval
default_window_size = 350

# Per-language overrides (language identifiers without dot prefix)
# Adjust these based on your codebase characteristics
[per_language]
python = 512          # Python: larger windows for docstrings and whitespace
javascript = 350      # JavaScript: default
typescript = 350      # TypeScript: default
typescriptreact = 350 # TSX: default
java = 512            # Java: larger for verbose syntax
cpp = 512             # C++: larger for headers and templates
c = 512               # C: larger for headers
go = 400              # Go: slightly larger for idiomatic code
rust = 400            # Rust: slightly larger for expressive types
markdown = 256        # Markdown: smaller for readability
text = 256            # Plain text: smaller chunks
json = 128            # JSON: smaller for structure preservation
toml = 128            # TOML: smaller for config files
yaml = 128            # YAML: smaller for config files

# OpenAI embedding model settings
[embeddings]
# Default embedding model ("text-embedding-3-small" or "text-embedding-3-large")
# Small is more cost-effective and sufficient for most use cases
model = "text-embedding-3-small"

# Tokenizer configuration for OpenAI models (uses cl100k_base encoding)
[tokenizer]
# OpenAI text-embedding-3-* models use "cl100k_base" encoding
# This should match the embedding model family
encoding = "cl100k_base"
