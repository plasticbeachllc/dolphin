# Unified Knowledge Store configuration
store_root: ~/.dolphin/knowledge_store
endpoint: 127.0.0.1:7777
default_embed_model: small
concurrency: 4
per_session_spend_cap_usd: 10.0
ignore:
  - .env
  - .env.*
  - .secrets
  - node_modules
  - .npm
  - .pnpm-store
  - .yarn
  - .yarn/cache
  - dist
  - build
  - coverage
  - .cache
  - target
  - vendor
  - .svelte-kit
  - .vercel
  - .vite
  - .next
  - .venv
  - .mypy_cache
  - .pytest_cache
  - .DS_Store
except:
  - .env.example
retrieval:
  top_k: 8
  max_snippet_tokens: 240
  score_cutoff: 0.15
