# Unified Knowledge Store configuration
store_root: ~/.dolphin/knowledge_store
endpoint: 127.0.0.1:7777
default_embed_model: small
concurrency: 4
per_session_spend_cap_usd: 10.0
ignore:
  - .env
  - .env.*
  - .secrets
  - node_modules
  - .npm
  - .pnpm-store
  - .yarn
  - .yarn/cache
  - dist
  - build
  - coverage
  - .cache
  - target
  - vendor
  - .svelte-kit
  - .vercel
  - .vite
  - .next
  - .venv
  - .mypy_cache
  - .pytest_cache
  - .DS_Store
except:
  - .env.example

# Dolphin Roadmap Features - Phase 2 Implementation
retrieval:
  top_k: 8
  max_snippet_tokens: 240
  score_cutoff: 0.15
  
  # Hybrid Search (BM25 + Vector) - +40% precision on identifiers
  hybrid_search:
    enabled: true
    # FTS5 BM25 will be used for lexical matching (exact terms, identifiers)
    # Vector search will be used for semantic matching (concepts, examples)
    fusion_method: "rrf"  # Reciprocal Rank Fusion
    fusion_k: 60  # RRF constant (standard value)
  
  # ANN Parameter Tuning - 40% faster vector searches
  ann:
    strategy: "adaptive"  # "speed", "accuracy", "adaptive", or "custom"
    metric: "cosine"  # Best for normalized embeddings (OpenAI, SBERT)
    
    # Adaptive strategy configuration
    adaptive:
      # Dataset size estimate for optimal nprobes calculation
      estimated_dataset_size: 100000
      # Query type detection
      default_query_type: "concept"  # "identifier", "concept", "example"
  
  # Cross-Encoder Reranking - +20-30% MRR improvement
  reranking:
    enabled: false  # Enable for maximum quality (slower)
    model: "cross-encoder/ms-marco-MiniLM-L-6-v2"  # Fast model for production
    device: null  # Auto-detect (CPU for most users)
    batch_size: 32  # Higher = faster but more memory
    candidate_multiplier: 4  # Rerank top_k × multiplier candidates
    score_threshold: 0.3  # Minimum relevance score (0-1)

# Embedding provider configuration
embedding:
  provider: "stub"  # "openai" or "stub"
  batch_size: 100
  api_key_env: "OPENAI_API_KEY"

# Performance benchmarking for systematic measurement
benchmarking:
  enabled: false  # Enable for performance tracking
  output_dir: "./benchmark_results"
  baseline_file: "./benchmark_baseline.json"
  
# Caching configuration
cache:
  enabled: true
  redis_url: null  # e.g., "redis://localhost:6379"
  embedding_ttl: 3600  # 1 hour
  result_ttl: 900  # 15 minutes
