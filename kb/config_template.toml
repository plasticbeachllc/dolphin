# Unified Knowledge Store configuration (TOML)

[storage]
store_root = "~/.dolphin/knowledge_store"

[server]
endpoint = "127.0.0.1:7777"

# Top-level settings
# (embedding model preferences moved to [embeddings] section)

[chunking]
default_window_size = 350
overlap_pct = 0.10

[chunking.per_language]
python = 512
typescript = 350
markdown = 256

[languages]
py = "python"
pyw = "python"
pyi = "python"
ts = "typescript"
tsx = "typescriptreact"
mts = "typescript"
cts = "typescript"
js = "javascript"
jsx = "javascriptreact"
mjs = "javascript"
cjs = "javascript"
md = "markdown"
markdown = "markdown"
mdx = "markdown"
toml = "toml"
yaml = "yaml"
yml = "yaml"
c = "c"
h = "c"
cpp = "cpp"
cxx = "cpp"
cc = "cpp"
hpp = "cpp"
hxx = "cpp"
hh = "cpp"
java = "java"
kt = "kotlin"
go = "go"
rs = "rust"
rb = "ruby"
php = "php"
sh = "shell"
bash = "shell"
zsh = "shell"
txt = "text"
log = "text"
json = "json"
jsonc = "json"
json5 = "json"

[embedding]
# Provider type: "stub" (zero-vectors for testing) or "openai" (real embeddings)
provider = "stub"

# Default embedding model preference (small|large)
# - small: text-embedding-3-small (1536 dimensions)
# - large: text-embedding-3-large (3072 dimensions)
default_embed_model = "large"

# Batch size for API calls (only used with "openai" provider)
batch_size = 100

# Concurrency for embedding API calls
concurrency = 3

# Per-session spend cap in USD
per_session_spend_cap_usd = 10.0

# Environment variable name containing the OpenAI API key
api_key_env = "OPENAI_API_KEY"

[cache]
# Enable query caching for performance and cost savings
enabled = true

# Redis connection URL (if None, uses in-memory cache)
# Example: "redis://localhost:6379/0"
redis_url = ""

# Time-to-live for cached embeddings (seconds)
# Default: 3600 (1 hour)
embedding_ttl = 3600

# Time-to-live for cached search results (seconds)
# Default: 900 (15 minutes)
result_ttl = 900

[tokenizer]
encoding = "cl100k_base"

[retrieval]
top_k = 8
max_snippet_tokens = 240
score_cutoff = 0.15

ignore = [
    ".env",
    ".env.*",
    ".secrets",
    "node_modules/**",
    ".npm",
    ".pnpm-store",
    ".yarn",
    ".yarn/cache",
    "dist/**",
    "build/**",
    "coverage/**",
    ".cache/**",
    "target/**",
    "vendor/**",
    ".svelte-kit/**",
    ".vercel/**",
    ".vite/**",
    ".next/**",
    ".venv/**",
    ".mypy_cache/**",
    ".pytest_cache/**",
    ".DS_Store",
]

except = [
    ".env.example"
]
