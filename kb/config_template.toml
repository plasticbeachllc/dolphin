# Unified Knowledge Store configuration (TOML)

[storage]
store_root = "~/.dolphin/knowledge_store"

[server]
endpoint = "127.0.0.1:7777"

# Top-level settings
# (embedding model preferences moved to [embeddings] section)

[chunking]
default_window_size = 350
overlap_pct = 0.10

[chunking.per_language]
python = 512
typescript = 350
markdown = 256

[languages]
py = "python"
pyw = "python"
pyi = "python"
ts = "typescript"
tsx = "typescriptreact"
mts = "typescript"
cts = "typescript"
js = "javascript"
jsx = "javascriptreact"
mjs = "javascript"
cjs = "javascript"
md = "markdown"
markdown = "markdown"
mdx = "markdown"
toml = "toml"
yaml = "yaml"
yml = "yaml"
c = "c"
h = "c"
cpp = "cpp"
cxx = "cpp"
hpp = "cpp"
hxx = "cpp"
go = "go"
java = "java"
rb = "ruby"
rs = "rust"
sh = "bash"
swift = "swift"
kt = "kotlin"
kts = "kotlin"
scala = "scala"
hs = "haskell"
pl = "perl"
pm = "perl"
php = "php"
html = "html"
css = "css"
json = "json"
sql = "sql"
dockerfile = "dockerfile"
docker = "dockerfile"
ipynb = "json"


[embeddings]
default_provider = "openai"
default_small_model = "text-embedding-3-small"
default_large_model = "text-embedding-3-large"
# Session spend cap in USD (0 = no limit)
session_spend_cap = 5.00

# Patterns that will always be ignored, overriding any repo-level settings.
# Supports gitignore-style glob patterns.
[ignore]
patterns = [
    ".git/",
    ".idea/",
    ".vscode/",
    "__pycache__/",
    "node_modules/",
    "*.pyc",
    "*.log",
    "*.tmp",
    "*.swp",
    ".DS_Store",
    "*.db",
    "*.sqlite",
    "*.sqlite3",
]

[retrieval]
# Settings for Approximate Nearest Neighbor (ANN) search
# These parameters control the speed-accuracy tradeoff for vector search.
[retrieval.ann]
# Strategy: "speed", "accuracy", "adaptive", or "custom"
# - speed: Optimizes for latency (95% recall, ~2x faster)
# - accuracy: Optimizes for recall (99% recall, default speed)
# - adaptive: Dynamically adjusts params based on query type and dataset size
# - custom: Use the specific values provided below
strategy = "adaptive"

# Custom parameters (only used if strategy = "custom")
# metric: Distance metric for similarity - "cosine", "L2", or "dot"
metric = "cosine"
# nprobes: Number of IVF clusters to probe (1-50)
nprobes = 20
# refine_factor: Post-filtering factor to improve precision (1-100)
refine_factor = 10

# Adaptive strategy configuration (only used if strategy = "adaptive")
[retrieval.ann.adaptive]
# Estimated number of vectors in the dataset; used for tuning nprobes
estimated_dataset_size = 100000
# Default query type for adaptive logic if not specified in the query
# Options: "identifier", "concept", "example"
default_query_type = "concept"

[retrieval.reranking]
# Enable or disable cross-encoder reranking
enabled = true
# Model name from HuggingFace model hub
model = "cross-encoder/ms-marco-MiniLM-L-6-v2"
# Device to run on: "cpu", "cuda", or an empty string for auto-detection
device = ""