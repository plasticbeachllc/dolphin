name: TypeScript Lint
on: [pull_request]
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install bun
        uses: oven-sh/setup-bun@v1

      - name: Install dependencies
        run: bun install

      - name: Run Prettier
        run: bun prettier --write "**/*.{ts,tsx,js,jsx,json,md}"

      - name: Run ESLint
        run: bun run lint:all

      - name: Configure Git
        run: |
          git config user.name "typescript-linter[bot]"
          git config user.email "typescript-linter[bot]@users.noreply.github.com"

      - name: Push changes
        run: |
          git add .
          git commit -m "TypeScript linting bot makes changes" || echo "No changes to commit"
          git push origin ${{ github.event.pull_request.head.ref }}
