name: TypeScript Lint
on: [pull_request]
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    if: |
      github.actor != 'python-linter[bot]' &&
      github.actor != 'typescript-linter[bot]'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install bun
        uses: oven-sh/setup-bun@v1

      - name: Install dependencies
        run: bun install

      - name: Run Prettier
        run: bun prettier --write "**/*.{ts,tsx,js,jsx,json,md}"

      - name: Run ESLint
        run: bun run lint:all

      - name: Configure Git
        run: |
          git config user.name "pb-typescript-linter[bot]"
          git config user.email "pb-typescript-linter[bot]@users.noreply.github.com"

      - name: Commit and push changes
        run: |
          git add .
          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "TypeScript linting bot makes changes"
          git pull --rebase origin ${{ github.event.pull_request.head.ref }} || true
          git push origin ${{ github.event.pull_request.head.ref }}
