name: Test Matrix

on:
  pull_request:
    branches:
      - "feature/**"
      - "develop"
      - "main"

jobs:
  unit-tests:
    name: Unit Tests
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
        # node-version: ["20"]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install bun
        uses: oven-sh/setup-bun@v1

      - name: Install just
        run: sudo apt-get update && sudo apt-get install -y just

      - name: Setup Python
        run: uv python install

      - name: Install dependencies
        run: bun install

      - name: Install Python dependencies
        run: uv sync --dev --group test

      - name: Run consolidated unit suite
        run: |
          just test-python unit
          just test-agent-core unit
          just test-shared
          just test-webview

  integration-tests:
    name: Integration Tests
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
        # node-version: ["20"]
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && (github.base_ref == 'develop' || github.base_ref == 'main')
    needs: unit-tests
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install bun
        uses: oven-sh/setup-bun@v1

      - name: Install just
        run: sudo apt-get update && sudo apt-get install -y just

      - name: Setup Python
        run: uv python install

      - name: Install dependencies
        run: bun install

      - name: Install Python dependencies
        run: uv sync --dev --group test

      - name: Install just
        run: sudo apt-get update && sudo apt-get install -y just

      - name: Run consolidated integration suite
        run: |
          just test-python integration
          just test-agent-core integration
          just test-mcp-bridge

  e2e-tests:
    name: E2E Tests
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
        node-version: ["20"]
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    needs: integration-tests
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Python
        run: uv python install

      - name: Install Python dependencies
        run: uv sync --dev --group test

      - name: Install dependencies
        run: bun install

      - name: Install just
        run: sudo apt-get update && sudo apt-get install -y just

      - name: Install Xvfb (for headless VSCode)
        run: sudo apt-get install -y xvfb

      - name: Run consolidated E2E suite (requires VSCode host)
        env:
          DISPLAY: :99.0
        run: |
          Xvfb :99 -screen 0 1024x768x24 &
          sleep 3
          just test-python e2e
          just test-agent-core e2e
          just test-extension all
