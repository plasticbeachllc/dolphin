name: Test Matrix

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - 'feature/**'
      - 'develop'
      - 'main'

jobs:
  unit-tests:
    name: Unit Tests
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
        # node-version: ["20"]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'uv'

      - name: Install bun
        uses: oven-sh/setup-bun@v1
        with:
          cache: 'bun'

      - name: Setup Python
        run: uv python install

      - name: Install dependencies
        run: bun install

      - name: Install Python dependencies
        run: uv sync --dev

      - name: Run unit tests
        run: bun run test:unit

  integration-tests:
    name: Integration Tests
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
        # node-version: ["20"]
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    needs: unit-tests
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'uv'

      - name: Install bun
        uses: oven-sh/setup-bun@v1
        with:
          cache: 'bun'

      - name: Setup Python
        run: uv python install

      - name: Install dependencies
        run: bun install

      - name: Install Python dependencies
        run: uv sync --dev

      - name: Run integration tests
        run: bun run test:integration

  e2e-tests:
    name: E2E Tests
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
        node-version: ["20"]
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && (github.base_ref == 'develop' || github.base_ref == 'main')
    needs: integration-tests
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          cache: 'bun'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'uv'

      - name: Install Python
        run: uv python install

      - name: Install Python dependencies
        run: uv sync

      - name: Install Xvfb (for headless environment)
        run: sudo apt-get install -y xvfb

      - name: Run Extension Tests
        run: |
          Xvfb :99 -screen 0 1024x768x24 &
          export DISPLAY=:99.0
          cd vscode-extension && npm run test:e2e
          npm run test --workspace vscode-extension/playwright
