name: Security Scan

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-audit:
    name: Python dependency audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - name: Install Python
        run: uv python install
      - name: Install dependencies
        run: uv sync --dev
      - name: Run pip-audit
        # CVE-2026-0994 / GHSA-7gcm-g887-7qv7: Protobuf JSON recursion DoS vulnerability
        # - Affects: protobuf up to 6.33.4
        # - Impact: JSON parsing can be exploited to cause denial-of-service through uncontrolled recursion
        # - Reason for ignoring: We require OTLP support which depends on protobuf. No fix available yet from upstream.
        #   We accept this risk for the critical observability functionality provided by OTLP.
        run: uv run pip-audit --local --skip-editable --progress-spinner=off --ignore-vuln CVE-2026-0994 --ignore-vuln GHSA-7gcm-g887-7qv7


  node-audit:
    name: JavaScript dependency audit
    runs-on: ubuntu-latest
    strategy:
      matrix:
        project:
          - .
          - mcp-bridge
          - shared
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install Bun
        uses: oven-sh/setup-bun@v2
      - name: Install dependencies (${{ matrix.project }})
        id: install
        working-directory: ${{ matrix.project }}
        run: |
          if [ ! -f package.json ]; then
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "No package.json found for ${{ matrix.project }}, skipping"
            exit 0
          fi
          bun install --ignore-scripts
          echo "found=true" >> "$GITHUB_OUTPUT"
      - name: Audit JS dependencies (${{ matrix.project }})
        if: steps.install.outputs.found == 'true'
        working-directory: ${{ matrix.project }}
        # minimatch ReDoS vulnerabilities (GHSA-3ppc-4f35-3m26, GHSA-7r86-cg39-jmmj, GHSA-23c5-xmqv-rm74)
        # are addressed via "minimatch": ">=3.1.3" override in root package.json.
        # If bun audit still flags them (override not resolving the transitive dep), keep as ignores.
        #
        # GHSA-2g4f-4pwh-qvx6 (CVE-2025-69873): ajv ReDoS when using $data option
        # - Severity: MODERATE
        # - Affects: ajv <6.14.0
        # - Impact: Regular expression denial-of-service when using the $data option in JSON schemas
        # - Reason for ignoring: ajv <6.14.0 is required by @modelcontextprotocol/sdk and eslint dependencies.
        #   The $data option is not used in our project's JSON schema validation, limiting exposure.
        #   We monitor for upstream patches and will update immediately when available.
        run: bun audit --ignore=GHSA-3ppc-4f35-3m26 --ignore=GHSA-7r86-cg39-jmmj --ignore=GHSA-23c5-xmqv-rm74 --ignore=GHSA-2g4f-4pwh-qvx6
