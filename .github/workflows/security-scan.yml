name: Security Scan

on:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 8 * * 1'  # Weekly on Monday at 8am UTC

permissions:
  contents: read

jobs:
  python-audit:
    name: Python dependency audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - name: Install Python
        run: uv python install
      - name: Install dependencies
        run: uv sync --dev
      - name: Run pip-audit
        # No ignored vulnerabilities. CVE-2026-0994 (protobuf) was resolved by upgrading to 6.33.5.
        run: uv run pip-audit --local --skip-editable --progress-spinner=off


  node-audit:
    name: JavaScript dependency audit
    runs-on: ubuntu-latest
    strategy:
      matrix:
        project:
          - .
          - mcp-bridge
          - shared
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install Bun
        uses: oven-sh/setup-bun@v2
      - name: Install dependencies (${{ matrix.project }})
        id: install
        working-directory: ${{ matrix.project }}
        run: |
          if [ ! -f package.json ]; then
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "No package.json found for ${{ matrix.project }}, skipping"
            exit 0
          fi
          bun install --ignore-scripts
          echo "found=true" >> "$GITHUB_OUTPUT"
      - name: Audit JS dependencies (${{ matrix.project }})
        if: steps.install.outputs.found == 'true'
        working-directory: ${{ matrix.project }}
        # All previously known issues are resolved via overrides in root package.json:
        #   - hono >=4.12.5: fixes GHSA-5pq2-9x2x-5p6w, GHSA-p6xx-57qc-3wxr, GHSA-q5qw-h33p-qvwr
        #   - @hono/node-server 1.19.11: fixes GHSA-wc8c-qw6v-h7f6
        #   - express-rate-limit 8.3.0: fixes GHSA-46wh-pxpv-q5gq
        #   - minimatch >=10.2.3: fixes ReDoS vulnerabilities
        #   - qs 6.15.0, body-parser 2.2.2: fixes prototype pollution
        #
        # GHSA-2g4f-4pwh-qvx6 (CVE-2025-69873): ajv ReDoS when using $data option
        # - Severity: MODERATE
        # - Affects: ajv <6.14.0 (transitive dep from @modelcontextprotocol/sdk and eslint)
        # - Reason for ignoring: Cannot use a global "ajv" override because eslint internally
        #   depends on ajv@8.x and the override causes API incompatibility. The $data option
        #   (required to trigger the vulnerability) is not used in our JSON schema validation.
        # - Upstream fix: requires @modelcontextprotocol/sdk and eslint to update their
        #   transitive ajv@6.x dependency. Monitor for updates.
        # - Added: 2026-03-06
        run: bun audit --ignore=GHSA-2g4f-4pwh-qvx6
