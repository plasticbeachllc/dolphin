name: Python Lint
on: [pull_request]
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    if: |
      github.actor != 'python-linter[bot]' &&
      github.actor != 'typescript-linter[bot]'
    strategy:
      matrix:
        python-version: ["3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Python
        run: uv python install

      - name: Install dependencies
        run: uv sync --dev

      - name: Ruff check
        run: uv run ruff check --fix
        continue-on-error: true

      - name: Ruff format
        run: uv run ruff format

      - name: Ty lint
        run: uv run ty check

      - name: Configure Git
        run: |
          git config user.name "pb-python-linter[bot]"
          git config user.email "pb-python-linter[bot]@users.noreply.github.com"

      - name: Push changes
        run: |
          git add .
          git commit -m "Python linting bot makes changes" || echo "No changes to commit"
          git push origin ${{ github.event.pull_request.head.ref }}
