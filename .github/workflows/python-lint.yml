name: Python Lint
on: [pull_request]
# Write permissions needed to auto-commit ruff fixes back to the PR branch
permissions:
  contents: write
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-latest
    if: |
      github.actor != 'pb-python-linter[bot]' &&
      github.actor != 'pb-typescript-linter[bot]'
    strategy:
      matrix:
        python-version: ["3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Python
        run: uv python install

      - name: Install dependencies
        run: uv sync --dev --group test

      - name: Ruff check
        run: uv run ruff check --fix --unsafe-fixes

      - name: Ruff format
        run: uv run ruff format

      - name: Ty lint
        run: uv run ty check

      - name: Configure Git
        run: |
          git config user.name "pb-python-linter[bot]"
          git config user.email "pb-python-linter[bot]@users.noreply.github.com"

      - name: Commit and push changes
        if: github.event.pull_request.head.repo.full_name == github.repository
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git add .
          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Python linting bot makes changes"
          git pull --rebase origin ${{ github.event.pull_request.head.ref }} || true
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git"
          git push origin ${{ github.event.pull_request.head.ref }}
