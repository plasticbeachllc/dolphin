name: Publish MCP Bridge

on:
  push:
    tags:
      - "mcp-v*.*.*" # Triggers on tags like mcp-v0.1.2

permissions:
  id-token: write # Required for OIDC
  contents: read # Required to checkout code

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        working-directory: ./mcp-bridge
        run: bun install

      - name: Validate tag matches version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#mcp-v}"
          PROJECT_VERSION="$(bun --eval 'const pkg = JSON.parse(await Bun.file("./mcp-bridge/package.json").text()); console.log(pkg.version)')"
          if [ "$TAG_VERSION" != "$PROJECT_VERSION" ]; then
            echo "Tag version ($TAG_VERSION) does not match mcp-bridge/package.json ($PROJECT_VERSION)"
            exit 1
          fi

      - name: Build package
        working-directory: ./mcp-bridge
        run: bun run build

      - name: Publish package
        working-directory: ./mcp-bridge
        run: bun publish --access public
