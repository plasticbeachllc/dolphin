name: Publish MCP Bridge

on:
  push:
    tags:
      - "mcp-v*.*.*" # Triggers on tags like mcp-v0.1.2

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v1

      - name: Install dependencies
        working-directory: ./mcp-bridge
        run: bun install

      - name: Validate tag matches version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#mcp-v}"
          PROJECT_VERSION="$(node -p "JSON.parse(require('fs').readFileSync('./mcp-bridge/package.json','utf8')).version")"
          if [ "$TAG_VERSION" != "$PROJECT_VERSION" ]; then
            echo "Tag version ($TAG_VERSION) does not match mcp-bridge/package.json ($PROJECT_VERSION)"
            exit 1
          fi

      - name: Build package
        working-directory: ./mcp-bridge
        run: bun run build

      - name: Publish to npm
        working-directory: ./mcp-bridge
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish
