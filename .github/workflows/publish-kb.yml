name: Publish Python Package

on:
  push:
    tags:
      - "py-v*.*.*" # Triggers on tags like py-v0.1.13

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Required for trusted publishing

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate tag matches version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#py-v}"
          PROJECT_VERSION="$(uv run python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")"
          if [ "$TAG_VERSION" != "$PROJECT_VERSION" ]; then
            echo "Tag version ($TAG_VERSION) does not match pyproject.toml ($PROJECT_VERSION)"
            exit 1
          fi

      - name: Build package
        run: uv build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        # Uses trusted publishing - configure in PyPI project settings
        # Alternative: use password/token by uncommenting below
        # with:
        #   password: ${{ secrets.PYPI_API_TOKEN }}
