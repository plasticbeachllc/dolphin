[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dolphin"
version = "0.1.2"
description = "Simple package to build and run OpenWebUI with helful MCP servers"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "docker>=7.1.0",
    "requests>=2.32.4", # For test scripts
    "mcpo>=0.0.19", # The main orchestrator
    "mcp-server-time>=0.1.0", # The time tool,
    "mcp-server-git>=0.0.1", # The git tool
    "fastapi",
    "uvicorn",
    "typer",
    "lancedb",
    "pydantic",
    "sqlmodel",
    "tiktoken",
    "openai",
    "tree-sitter>=0.25.0",
    "tree-sitter-python>=0.25.0",
    "tree-sitter-javascript>=0.25.0",
    "markdown-it-py",
    "pathspec",
    "pyyaml",
    "python-dotenv",
    "sqlite-utils",
    "tomli ; python_full_version < '3.11'",
]

[project.scripts]
kb = "pb_kb.ingest.cli:app"
kb-api = "pb_kb.api.app:main"
personas = "personas.src.personas:app"

[tool.hatch.build.targets.wheel]
packages = ["src/pb_kb", "personas"]

[tool.hatch.build.targets.sdist]
include = ["src/pb_kb", "personas"]

[tool.uv.sources]
dolphin = { workspace = true }
