[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pb-dolphin"
version = "0.1.13"
description = "Full-stack AI enablement platform"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    {name = "Plastic Beach, LLC", email = "info@plasticbeach.email"},
    {name = "tdc93", email = "taylor@plasticbeach.email"}
]
maintainers = [
    {name = "Plastic Beach, LLC", email = "info@plasticbeach.email"},
    {name = "tdc93", email = "taylor@plasticbeach.email"}
]
license = {text = "MIT"}
keywords = ["mcp", "ai", "search", "llm", "knowledge-base"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    # Core dependencies (~200MB)
    "fastapi",
    "uvicorn",
    "typer",
    "lancedb",
    "pydantic",
    "sqlmodel",
    "tiktoken",
    "openai",
    "tree-sitter>=0.25.0",
    "tree-sitter-python>=0.25.0",
    "tree-sitter-javascript>=0.25.0",
    "tree-sitter-typescript>=0.23.0",
    "markdown-it-py",
    "pathspec",
    "pyyaml",
    "python-dotenv",
    "sqlite-utils",
    "tomli ; python_full_version < '3.11'",
    # Graph intelligence dependencies (Phase 1)
    "networkx>=3.2",
    "python-louvain>=0.16",
    "scipy>=1.11.0",
    # Observability (EP-1)
    "prometheus-client>=0.19.0",
    "opentelemetry-api>=1.20.0",
    "opentelemetry-sdk>=1.20.0",
    "opentelemetry-instrumentation-fastapi>=0.41b0",
    "opentelemetry-exporter-jaeger>=1.20.0",
]

[project.urls]
Homepage = "https://plasticbeach.llc/"
Documentation = "https://github.com/plasticbeachllc/dolphin"
Repository = "https://github.com/plasticbeachllc/dolphin"
Issues = "https://github.com/plasticbeachllc/dolphin/issues"
Changelog = "https://github.com/plasticbeachllc/dolphin/blob/main/CHANGELOG.md"

[project.optional-dependencies]
# Cross-encoder reranking support (~2GB with torch)
reranking = [
    "torch>=2.2.0",
    "sentence-transformers>=2.3.0",
]

test = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-xdist>=3.3.0",
    "pytest-asyncio>=0.21.0",
    "pytest-mock>=3.11.0",
    "responses>=0.24.0",
    "freezegun>=1.2.0",
    "fakeredis>=2.18.0",
    "httpx>=0.25.0",
]
dev = [
    "black>=23.0.0",
    "isort>=5.12.0",
    "mypy>=1.5.0",
    "ruff>=0.1.0",
    "pre-commit>=3.4.0",
]

[project.scripts]
dolphin = "kb.cli:main"
kb = "kb.ingest.cli:app"
kb-api = "kb.api.server:main"

[tool.hatch.build.targets.wheel]
packages = ["kb"]

[tool.hatch.build.targets.wheel.shared-data]
"kb/config_template.toml" = "kb/config_template.toml"

[tool.hatch.build.targets.sdist]
include = ["kb", "kb/config_template.toml"]

[tool.uv.sources]
dolphin = { workspace = true }

[dependency-groups]
dev = [
    "black>=25.9.0",
    "build>=1.3.0",
    "isort>=7.0.0",
    "mypy>=1.5.0",
    "psutil>=7.1.2",
    "pylint>=3.0.0",
    "pytest>=8.4.2",
    "pytest-asyncio>=1.2.0",
    "ruff>=0.1.0",
    "twine>=6.2.0",
    "ty>=0.0.1a26",
]
test = [
    "fakeredis>=2.32.0",
    "freezegun>=1.5.5",
    "httpx>=0.28.1",
    "psutil>=7.1.2",
    "pytest>=8.4.2",
    "pytest-asyncio>=1.2.0",
    "pytest-cov>=7.0.0",
    "pytest-mock>=3.15.1",
    "pytest-xdist>=3.8.0",
    "responses>=0.25.8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
    "asyncio: marks tests as async tests",
    "performance: marks tests as performance tests",
    "scenario: marks tests as scenario tests",
]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["kb"]
omit = [
    "*/tests/*",
    "*/test_*.py",
    "*/__pycache__/*",
    "*/migrations/*",
    "*/.venv/*",
    "*/venv/*",
]
branch = true
parallel = true

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false
skip_empty = true
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]

# Fail build if coverage is below 75%
fail_under = 75.0

[tool.coverage.html]
directory = "tests/reports/htmlcov"
show_contexts = true

[tool.coverage.xml]
output = "tests/reports/coverage.xml"

[tool.coverage.json]
output = "tests/reports/coverage.json"
show_contexts = true

[tool.mypy]
python_version = "3.12"
warn_return_any = false
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
check_untyped_defs = false
# Disable strict optional checking to reduce noise
strict_optional = false
# Allow untyped calls
disallow_untyped_calls = false
# Allow untyped decorators
disallow_untyped_decorators = false

[[tool.mypy.overrides]]
module = [
    "kb.ingest.pipeline",
    "kb.api.search_backend",
    "kb.store.sqlite_meta",
    "kb.config",
    "kb.retrieval.graph_context",
    "kb.search.parallel_search",
    "kb.ingest.optimized_pipeline",
    "kb.graph_intelligence.graph_store",
    "kb.retrieval.rankers",
    "kb.logging.structured_logger",
    "kb.chunkers.ts_chunker",
    "kb.chunkers.py_chunker",
    "kb.ingest.graph_helpers",
    "kb.api.app",
    "kb.ingest.cli",
    "kb.api.server",
]
ignore_errors = true

[tool.pylint.main]
fail-under = 8.0
disable = [
    "duplicate-code",
]

[tool.ruff]
# Configure linting behavior
[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort (import sorting)
    "UP", # pyupgrade
]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["kb"]
combine-as-imports = true
split-on-trailing-comma = false
