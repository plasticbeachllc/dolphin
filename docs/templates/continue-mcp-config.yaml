# Continue.dev MCP Server Configuration
# Add this to your config.yaml file

mcpServers:
  # Recommended: Run without installation using bunx
  - name: Dolphin-KB
    description: "Dolphin semantic code search"
    command: bunx
    args:
      - dolphin-mcp
    env:
      DOLPHIN_API_URL: "http://127.0.0.1:7777"
      LOG_LEVEL: "info"
      # Optional: Performance optimization for parallel snippet fetching
      MAX_CONCURRENT_SNIPPET_FETCH: "8"
      SNIPPET_FETCH_TIMEOUT_MS: "2000"
      SNIPPET_FETCH_RETRY_ATTEMPTS: "1"
    connectionTimeout: 30000

# Alternative: If you installed globally (bun install -g dolphin-mcp)
# - name: Dolphin-KB
#   description: "Dolphin semantic code search"
#   command: dolphin-mcp
#   env:
#     DOLPHIN_API_URL: "http://127.0.0.1:7777"
#     LOG_LEVEL: "info"
#   connectionTimeout: 30000

# Setup:
# 1. Ensure Dolphin API is running on http://127.0.0.1:7777
# 2. Add mcpServers section above to your config.yaml
# 3. Restart Continue.dev

# Available Tools:
# - search_knowledge: Semantic code search
# - fetch_chunk: Get chunk content by ID
# - fetch_lines: Get file lines by range
# - get_vector_store_info: Get KB statistics
# - open_in_editor: Generate VS Code URI